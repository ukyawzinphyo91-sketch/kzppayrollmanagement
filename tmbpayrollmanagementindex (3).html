<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0a1120">
<title>TMB Payroll Management</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Noto+Sans+Myanmar:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a1120;--s1:#0f1a30;--s2:#18264a;--s3:#22365c;--ln:#263759;--t:#eef2fa;--m:#9db0cb;--g:#2fc27b;--g2:#17803f;--r:#e0524f;--a:#ffb020;--st:0px}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--t);overflow:hidden}
body{font:15px/1.4 Figtree,"Noto Sans Myanmar",system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit;background:none;border:0;outline:0;text-align:inherit}
button{cursor:pointer;padding:0}
input,select{user-select:text;-webkit-user-select:text}
#app{position:fixed;inset:0;max-width:480px;margin:0 auto;overflow:hidden;background:var(--bg)}
#view{position:absolute;inset:0;overflow-y:auto;padding:calc(var(--st) + 14px) 16px 170px;scrollbar-width:none}
#view::-webkit-scrollbar{display:none}
.in-r{animation:inR .36s cubic-bezier(.2,.8,.2,1)}
.in-l{animation:inL .36s cubic-bezier(.2,.8,.2,1)}
.fade{animation:fd .3s ease}
@keyframes inR{from{opacity:0;transform:translateX(30px)}}
@keyframes inL{from{opacity:0;transform:translateX(-30px)}}
@keyframes fd{from{opacity:0;transform:translateY(8px)}}
@keyframes sh{from{background-position:200% 0}to{background-position:-200% 0}}
@keyframes up{from{opacity:0;transform:translateY(40px)}}
@keyframes dr{to{stroke-dashoffset:0}}
.sk{height:120px;border-radius:22px;background:linear-gradient(90deg,var(--s1) 25%,var(--s3) 50%,var(--s1) 75%) 0 0/200% 100%;animation:sh 1.2s linear infinite;margin-bottom:14px}
.row{display:flex;align-items:center;gap:12px}
.muted{color:var(--m);font-size:13px}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.big{font-size:17px;font-weight:700}
.cap{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--m);font-weight:600}
.r{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.pos{color:#2fc27b}.neg{color:var(--t)}

/* header (Home) */
.hh{display:flex;align-items:center;gap:12px;margin:6px 0 18px}
.hh .t{flex:1;min-width:0}
.hh .gd{font-size:19px;color:#e9eef8;line-height:1.1}
.hh h1{margin:4px 0 0;font-size:26px;font-weight:600;line-height:1.1;white-space:nowrap}
.bellb{position:relative;width:48px;height:48px;border-radius:15px;background:#121f38;border:1px solid #2a3c60;display:grid;place-items:center;color:#eef2fa;flex:none}
.bd9{position:absolute;top:-9px;right:-10px;background:#e8433f;color:#fff;font-style:normal;font-size:12px;font-weight:700;border-radius:99px;padding:2px 7px;border:2px solid var(--bg)}

/* generic page header */
.hd{display:flex;align-items:center;gap:12px;min-height:46px;margin-bottom:12px}
.hd h1{font-size:26px;font-weight:600;letter-spacing:-.3px;margin:0;flex:1;min-width:0}
.ib{width:42px;height:42px;border-radius:14px;background:#121f38;border:1px solid #2a3c60;display:grid;place-items:center;flex:none}

/* balance hero (matches Home screenshot) */
.tb2{position:relative;border-radius:22px;padding:18px 18px 20px;background:linear-gradient(135deg,#1b3a37,#1d2e4e 70%);border:1px solid #2b4560;overflow:hidden;margin-bottom:12px}
.tb2 .wm{position:absolute;right:-14px;top:-18px;width:130px;height:130px;border-radius:50%;border:1px dashed rgba(255,255,255,.18);display:grid;place-items:center;opacity:.55}
.tb2 .lb2{font-size:17px;color:#e9eef8;display:flex;justify-content:space-between;align-items:center;position:relative}
.tb2 .eyeb{color:#e9eef8;padding:4px}
.tb2 .bigv{font-size:30px;font-weight:700;margin:14px 0 20px;letter-spacing:-.3px;line-height:1.1;position:relative;white-space:nowrap;font-variant-numeric:tabular-nums}
.acts{display:grid;grid-template-columns:repeat(3,1fr);row-gap:16px;text-align:center}
.acts button{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:15.5px;color:#e9eef8}
.acts .ti{width:47px;height:47px;border-radius:14px;background:rgba(255,255,255,.15);display:grid;place-items:center;color:#f1f5fb}
.acts .dis{opacity:.4}
.tb2 hr{border:0;border-top:1px solid rgba(255,255,255,.14);margin:16px 6px}
.tip{display:flex;gap:12px;align-items:center;border:1px solid #14403a;background:#0e2a29;border-radius:16px;padding:14px;font-size:16.5px;line-height:1.3;color:#eef2fa}
.tip b{color:#2fc27b;font-weight:500}

/* cards */
.card{background:var(--s1);border:1px solid #2a3c60;border-radius:18px;padding:16px;margin-bottom:12px}
.card.row{display:flex;align-items:center;gap:14px;padding:15px 16px}
.card.row .mid{flex:1;min-width:0}
.card.hero{background:linear-gradient(135deg,#1b3a37,#1d2e4e 70%);border:1px solid #2b4560}
.ico{width:44px;height:44px;border-radius:50%;background:#12302f;color:#2fc27b;display:grid;place-items:center;flex:none}
.ib2{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;flex:none}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:99px;background:#10343a;color:#2fb872;font-size:13px;padding:6px 12px;white-space:nowrap}
.sec{display:flex;justify-content:space-between;align-items:center;font-size:17px;font-weight:700;margin:22px 2px 10px}
.sec button{color:#2fc27b;font-size:14px;font-weight:600}
.lab{font-size:13px;color:var(--m);margin:18px 0 8px;font-weight:600}
.hint{font-size:13px;color:#c9d3e6;margin:7px 2px 0;line-height:1.45}
.hint.bad{color:#ff8a87}.hint.ok{color:#2fc27b}
.fld{display:flex;align-items:center;gap:10px;height:54px;padding:0 15px;border-radius:14px;background:#1c2b48;border:1px solid rgba(255,255,255,.045);color:#b9c6dd;transition:border-color .2s}
.fld:focus-within{border-color:#2fc27b}
.fld input,.fld select{flex:1;min-width:0;height:100%;font-size:16.5px;color:var(--t);font-weight:500}
.fld select{appearance:none;-webkit-appearance:none}
.pre{font-size:13px;color:#c3cfe3;font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.money{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px}
.seg{display:flex;gap:4px;padding:4px;border-radius:14px;background:var(--s1);border:1px solid var(--ln)}
.seg button{flex:1;height:40px;border-radius:10px;color:var(--m);font-weight:600;font-size:14.5px;white-space:nowrap;padding:0 6px}
.seg button.on{background:#233352;color:#fff}
.opt{display:flex;align-items:center;gap:12px;padding:15px 16px;margin-bottom:10px;width:100%;text-align:left;border-radius:14px;background:#1c2b48}
.opt.on{background:#17803f}
.rd{width:22px;height:22px;border-radius:50%;border:2px solid #9db0cb;display:grid;place-items:center;flex:none}
.opt.on .rd{border-color:#fff}
.opt.on .rd::after{content:"";width:10px;height:10px;border-radius:50%;background:#fff}
.cb{width:24px;height:24px;border-radius:7px;border:2px solid #9db0cb;display:grid;place-items:center;flex:none;color:#fff}
.cb.on{background:#17803f;border-color:#17803f}
.sw{width:50px;height:30px;border-radius:99px;background:#2a3c60;position:relative;flex:none;transition:background .25s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .25s;box-shadow:0 2px 6px #0005}
.sw.on{background:#17803f}
.sw.on::after{transform:translateX(20px)}
.net{display:flex;justify-content:space-between;align-items:center;margin-top:14px;padding:16px;border-radius:14px;background:#0b2a29;border:1px solid #15403a}
.net b{font-size:22px;color:#2fd488;font-variant-numeric:tabular-nums}
.warn{margin-top:12px;padding:12px 14px;border-radius:14px;background:rgba(255,176,32,.1);border:1px solid rgba(255,176,32,.3);color:#ffd08a;font-size:14px}

/* business + employees (original screen language) */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.bc{position:relative;text-align:left;background:linear-gradient(160deg,rgba(23,58,108,.62),rgba(13,36,72,.62));border:1px solid #1f4a85;border-radius:22px;padding:16px;min-height:196px;color:#fff;display:flex;flex-direction:column;gap:6px}
.bc .ar{position:absolute;top:14px;right:14px;width:34px;height:34px;border-radius:50%;border:1px solid #3b8cff;display:grid;place-items:center;color:#3b8cff}
.bc .bi{width:56px;height:56px;border-radius:14px;display:grid;place-items:center;margin-bottom:auto}
.bc b{display:block;font-size:19px;font-weight:600;line-height:1.25}
.bc .vm{font-size:16px;color:#b5c3dc}
.bc .tmc{font-size:21px;font-weight:700;line-height:1.25}
.bl{display:flex;align-items:center;gap:14px;background:linear-gradient(160deg,rgba(23,58,108,.55),rgba(13,36,72,.55));border:1px solid #1f4a85;border-radius:20px;padding:16px;margin-top:14px;width:100%;color:#fff}
.bl .bi{width:56px;height:56px;border-radius:14px;display:grid;place-items:center;flex:none}
.bl .mid{flex:1;min-width:0}
.bl b{font-size:18.5px;font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bl .s{font-size:15px;color:#b5c3dc;line-height:1.3}
.bl .rg{text-align:right;font-weight:700;font-size:17px;white-space:nowrap;flex:none}
.bl .rg i{display:block;width:9px;height:9px;border-radius:50%;background:#1ed37b;margin:8px 4px 0 auto}
.pill{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:99px;background:rgba(14,90,60,.38);border:1px solid #14754b;color:#27d083;font-size:15px;font-weight:600;margin:6px 0 16px}
.sel2{display:inline-flex;align-items:center;gap:8px;border:1px solid #1f4a85;background:rgba(22,52,96,.55);border-radius:14px;padding:10px 13px;font-size:16px;font-weight:600}
.ecard{background:var(--s1);border:1px solid #2a3c60;border-radius:18px;margin-bottom:12px;overflow:hidden;text-align:left;width:100%}
.erow{display:flex;align-items:center;gap:10px;padding:16px 14px 14px}
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:16px;flex:none;background:#12302f;color:#2fc27b}
.av.x{background:#3a1b24;color:#e0524f}
.emid{flex:1;min-width:0}
.nm{display:flex;align-items:center;gap:6px;min-width:0}
.nm b{font-size:18px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;background:#0f3a33;color:#2fc27b;white-space:nowrap}
.tag.x{background:#4a1f26;color:#e0524f}
.em{color:#d3dcec;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.eam{text-align:right;flex:none;max-width:52%}
.eam b{font-size:16.5px;font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.eam small{display:block;font-size:12px;color:#c3cfe3;white-space:nowrap;margin-top:2px}
.edit{display:flex;align-items:center;justify-content:center;gap:8px;padding:13px;border-top:1px solid #2a3c60;font-size:16px;color:#e9eef8}
.bal2{display:flex;justify-content:space-between;gap:10px;padding:18px 16px}
.bal2 .amt{font-size:25px;font-weight:600;line-height:1.25;margin:5px 0 6px;font-variant-numeric:tabular-nums}
.spark{width:100%;height:58px;display:block;margin-top:10px}

/* tab bar (matches Home screenshot) */
.tabbar{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-around;align-items:flex-end;padding:10px 4px calc(env(safe-area-inset-bottom,0px) + 6px);background:#08142a;border-top:1px solid #16315a;z-index:5;transition:transform .3s,opacity .3s}
.tabbar.off{transform:translateY(120%);opacity:0;pointer-events:none}
.tabbar button{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px;color:#e6ecf6;min-width:66px;padding:2px 4px;border-radius:12px;flex:1}
.tabbar button i{display:grid;place-items:center;height:28px}
.tabbar button.on{color:#2fc27b}
.tabbar button.home{margin-top:-30px}
.tabbar .hc{width:58px;height:58px;border-radius:50%;background:#12a05a;border:4px solid #08142a;display:grid;place-items:center;color:#fff;box-shadow:0 6px 18px rgba(18,160,90,.35)}
.tabbar button.home.on{color:#e6ecf6}

/* action bar for forms */
#cta{position:absolute;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 100px);z-index:6;transition:transform .35s,opacity .35s}
#cta.hide{transform:translateY(150%);opacity:0}
.tg #cta{display:none}
.btn{width:100%;height:54px;border-radius:14px;background:#17803f;color:#fff;font-weight:700;font-size:17px;display:flex;align-items:center;justify-content:center;gap:9px;box-shadow:0 12px 28px -12px rgba(23,128,63,.8);transition:transform .15s}
.btn:active{transform:scale(.98)}
.btn:disabled{background:#22365c;color:#9db0cb;box-shadow:none;cursor:not-allowed}
.btn.ghost{background:#18264a;border:1px solid #2a3c60;color:var(--t);box-shadow:none}

/* feedback */
#toast{position:absolute;top:calc(var(--st) + 12px);left:50%;transform:translate(-50%,-160%);max-width:calc(100% - 40px);background:#e9fff3;color:#0a4a2c;font-weight:600;font-size:14px;padding:12px 18px;border-radius:15px;z-index:30;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-shadow:0 14px 30px #0009;transition:transform .4s cubic-bezier(.2,.8,.2,1)}
#toast.on{transform:translate(-50%,0)}
#toast.bad{background:#ffe6e6;color:#7a1d1d}
#sheet{position:absolute;inset:0;z-index:20;display:none}
#sheet.on{display:block}
#sheet .ov{position:absolute;inset:0;background:rgba(3,7,16,.6);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
#sheet .pn{position:absolute;left:0;right:0;bottom:0;padding:12px 20px calc(env(safe-area-inset-bottom,0px) + 22px);background:#0f1a30;border-radius:28px 28px 0 0;border-top:1px solid #2a3c60;animation:up .34s cubic-bezier(.2,.8,.2,1)}
.grab{width:44px;height:5px;border-radius:9px;background:#2a3c60;margin:0 auto 16px}
.sh-t{font-size:21px;font-weight:700;margin:0}
.kv{display:flex;justify-content:space-between;align-items:center;padding:13px 2px;border-bottom:1px solid #263759;font-size:15px;color:var(--m)}
.kv b{color:var(--t);font-variant-numeric:tabular-nums}
#done{position:absolute;inset:0;z-index:40;display:none;align-items:center;justify-content:center;padding:26px;background:radial-gradient(70% 45% at 50% 30%,#14503a,var(--bg))}
#done.on{display:flex}
.dn{width:100%;display:flex;flex-direction:column;align-items:center;text-align:center;animation:fd .5s ease}
.dn h2{font-size:28px;font-weight:700;margin:20px 0 6px}
.dn .card{width:100%;text-align:left;margin:22px 0}
.chk path{stroke-dasharray:80;stroke-dashoffset:80;animation:dr .7s .25s cubic-bezier(.4,0,.2,1) forwards}
</style>
</head>
<body>
<div id="app">
 <div id="toast"></div>
 <main id="view"><div class="sk"></div><div class="sk" style="height:200px"></div><div class="sk"></div></main>
 <nav class="tabbar" id="tb"></nav>
 <div id="cta"></div>
 <div id="sheet"><div class="ov" data-a="close"></div><div class="pn" id="pn"></div></div>
 <div id="done"></div>
</div>

<script>
const tg=(window.Telegram&&window.Telegram.WebApp)||null;
const IN_TG=!!(tg&&tg.initData);

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const f2=n=>Number(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const cash=n=>'Cash '+f2(n);
const tmc=n=>'TMC '+f2(n);
const r2=n=>Math.round(n*100)/100;
const ini=n=>String(n).split(' ').filter(Boolean).map(w=>w[0]).slice(0,2).join('').toUpperCase();
const clone=o=>JSON.parse(JSON.stringify(o));
const today=()=>new Date().toLocaleDateString('en-US',{month:'short',day:'numeric'});
const compNet=s=>r2(s.b-s.fi-s.lv+s.ot+s.al);
const payout=s=>(s.ov!=null&&s.ov!=='')?r2(Number(s.ov)):compNet(s);
const EM=/^[a-z0-9._%+-]+@gmail\.com$/i;
const UID=/^\d{10}$/;
const nameFrom=em=>em.split('@')[0].split(/[._-]+/).map(w=>w.replace(/\d+/g,'')).filter(Boolean).map(w=>w[0].toUpperCase()+w.slice(1)).join(' ')||'New employee';
const emErr=s=>{const em=s.email.trim();return !em?'':!EM.test(em)?'Please enter a valid Gmail address (name@gmail.com)':D.emps.some(e=>e.email.toLowerCase()===em.toLowerCase())?'This employee is already on your payroll':''};
const uidErr=s=>(s.uid&&!UID.test(s.uid))?'User ID must be exactly 10 digits':'';
const addErr=s=>!s.email.trim()?'Enter the employee email':(emErr(s)||uidErr(s));

const MASC=(z=44)=>`<svg width="${z}" height="${z}" viewBox="0 0 48 48"><circle cx="24" cy="24" r="23" fill="#0f3a2a" stroke="#1f7a4d" stroke-width="2"/><path d="M24 9c-3 3-9 7-9 15 0 7 4 12 9 12s9-5 9-12c0-8-6-12-9-15z" fill="#8fe04b"/><path d="M24 9c3 2 5 5 6 8-2-1-4-1-6 0z" fill="#c8f56b"/><ellipse cx="20" cy="25" rx="2" ry="2.6" fill="#0b2a1c"/><ellipse cx="28" cy="25" rx="2" ry="2.6" fill="#0b2a1c"/><path d="M21 30q3 3 6 0" stroke="#0b2a1c" stroke-width="1.8" fill="none" stroke-linecap="round"/><circle cx="17" cy="29" r="1.8" fill="#ff9a8a" opacity=".7"/><circle cx="31" cy="29" r="1.8" fill="#ff9a8a" opacity=".7"/></svg>`;

const IC={
 home:'<path d="M3 11l9-7 9 7v9a1 1 0 01-1 1h-5v-6h-6v6H4a1 1 0 01-1-1z"/>',
 biz:'<rect x="3" y="7" width="18" height="13" rx="3"/><path d="M9 7V5.5A1.5 1.5 0 0110.5 4h3A1.5 1.5 0 0115 5.5V7M3 13h18"/>',
 user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c.6-4 4-6 8-6s7.4 2 8 6"/>',
 card:'<rect x="3" y="5" width="18" height="14" rx="3"/><path d="M3 10h18"/>',
 receipt:'<path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/>',
 down:'<circle cx="12" cy="12" r="10"/><path d="M12 8v8m-4-4l4 4 4-4"/>',
 up:'<circle cx="12" cy="12" r="10"/><path d="M12 16V8m-4 4l4-4 4 4"/>',
 swap:'<circle cx="12" cy="12" r="10"/><path d="M7 12h10m-4-4l4 4-4 4"/>',
 scan:'<path d="M4 9V6a2 2 0 012-2h3M15 4h3a2 2 0 012 2v3M20 15v3a2 2 0 01-2 2h-3M9 20H6a2 2 0 01-2-2v-3"/>',
 bill:'<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h4"/>',
 qr:'<rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><path d="M14 14h2.5v2.5H14zM18 18h2.5M18 14h2.5M14 19v1.5"/>',
 bell:'<path d="M6 17V11a6 6 0 0112 0v6l1.5 2h-15z"/><path d="M10 21h4"/>',
 eye:'<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
 eyeoff:'<path d="M3 3l18 18M10.6 6.2A9.6 9.6 0 0112 6c6.4 0 10 6 10 6a17 17 0 01-3.2 3.8M6.1 6.9A17 17 0 002 12s3.6 6 10 6c1.7 0 3.2-.5 4.5-1.2"/>',
 chR:'<path d="M9 6l6 6-6 6"/>',
 chL:'<path d="M15 6l-6 6 6 6"/>',
 chD:'<path d="M6 9l6 6 6-6"/>',

 const sum=r2(list.reduce((s,x)=>s+x.a,0)),fees=r2(list.reduce((s,x)=>s+x.fee,0)),emp=r2(sum*0.0025);
 return{list,n:list.length,sum,fees,emp,total:r2(sum+emp)}}

 const d=p.map((q,i)=>(i?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1)).join('');
 return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><defs><linearGradient id="sg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#7bf5b8" stop-opacity=".4"/><stop offset="1" stop-color="#7bf5b8" stop-opacity="0"/></linearGradient></defs><path d="${d}L${W} ${H}L0 ${H}Z" fill="url(#sg)"/><path d="${d}" fill="none" stroke="#7bf5b8" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></svg>`};

  return `<div class="hd"><button class="ib" data-a="back">${ic('back',20)}</button><h1>Manual payroll</h1></div>
<div class="grid2"><div class="card" style="margin:0"><div class="cap">Dept balance</div><div class="big" style="margin-top:8px">${cash(D.bal)}</div></div><div class="card" style="margin:0"><div class="cap">Total debit</div><div class="big" style="margin-top:8px">${cash(x.total)}</div></div></div>
<div class="card row" style="margin-top:12px;align-items:flex-start">${ic('info',18)}<div><div class="big" style="font-size:15px">PMS fee 0.25%</div><div class="muted">Employer: ${cash(x.emp)}. Each employee also pays 0.25% of their gross.</div></div></div>
${x.n&&x.total>D.bal?`<div class="warn">Insufficient balance. You are short by ${cash(r2(x.total-D.bal))}.</div>`:''}
<div class="sec">${x.n} of ${act.length} selected<span><button data-a="all">Select all</button> · <button data-a="none" style="color:var(--m)">Clear</button></span></div>
${act.map(e=>{const on=(d.sel||[]).includes(e.id),a=payout(e.sal),fee=r2(a*0.0025);
 return `<button class="ecard" style="padding:14px 16px" data-a="sel" data-id="${e.id}"><div class="row"><span class="cb ${on?'on':''}">${on?ic('check',16):''}</span><span class="av">${ini(e.name)}</span><div class="emid"><b class="ell" style="display:block;font-size:17px">${esc(e.name)}</b><div class="em">${esc(e.email)}</div></div></div>
${on?`<div class="kv" style="margin-top:12px;padding:12px 0 0;border-top:1px solid #2a3c60;border-bottom:0"><span>Amount this run</span><b>${cash(a)}</b></div><div class="muted" style="margin-top:6px">PMS ${cash(fee)} · net to employee ${cash(r2(a-fee))}</div>`:''}</button>`}).join('')}
${sus.length?`<div class="sec">Skipped</div>${sus.map(e=>`<div class="card row" style="opacity:.7"><span class="av x">${ini(e.name)}</span><div class="mid"><b>${esc(e.name)}</b><div class="muted">Suspended · excluded from this run</div></div><span class="tag x">Suspended</span></div>`).join('')}`:''}`}
};

const ROOT=['home','transactions','accounts','business','profile'];
let stack=[{n:'home',d:{}}],tabN='home',kycT=null;
const cur=()=>stack[stack.length-1];
const hap=s=>{try{tg&&tg.HapticFeedback&&tg.HapticFeedback.impactOccurred(s||'light')}catch(e){}};
function toast(m,k){const t=$('#toast');t.className=k||'';t.textContent=m;void t.offsetWidth;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('on'),2300)}
const go=(n,d={})=>{stack.push({n,d});render('in-r')};
const back=()=>{if(stack.length>1){stack.pop();render('in-l')}};
const tab=n=>{tabN=n;stack=[{n,d:{}}];render('fade')};

function render(mode){
 const c=cur(),v=$('#view');
 const y=v.scrollTop;
 v.innerHTML=V[c.n](c.d);
 v.className='';void v.offsetWidth;
 if(mode==='keep'){v.scrollTop=y}else{v.scrollTop=0;v.className=mode||'fade'}
 $('#tb').classList.toggle('off',stack.length>1);
 $('#tb').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.v===tabN));
 if(tg){try{stack.length>1?tg.BackButton.show():tg.BackButton.hide();
  ['add','edit','sched','manual'].includes(c.n)?tg.enableClosingConfirmation():tg.disableClosingConfirmation()}catch(e){}}
 live();
 if(c.n==='home')countUp();
}
function countUp(){const el=$('#tot');if(!el||D.hide)return;const to=D.total,t0=performance.now();
 const step=t=>{const p=Math.min(1,(t-t0)/900),e=1-Math.pow(1-p,3);el.textContent=tmc(to*e);if(p<1)requestAnimationFrame(step)};requestAnimationFrame(step)}

function updEdit(){const s=cur().d.dr;const n=$('#netOut');if(!n)return;const cn=compNet(s.sal);
 n.textContent=cash(cn);
 $('#nW').textContent=cn<0?'Net pay cannot be negative':'Basic + overtime + allowance − deductions';
 $('#ovH').textContent=(s.sal.ov!=null&&s.sal.ov!=='')?`Will pay ${cash(Number(s.sal.ov))} instead of the computed net.`:''}
function updAdd(){const s=cur().d.dr;const h=$('#emH'),k=$('#kycW'),u=$('#uH');if(!h)return;
 const e=emErr(s),ok=!addErr(s);
 h.className='hint '+(e?'bad':ok?'ok':'');h.textContent=e||(ok?'Email format verified':'Enter the email linked to their TMB profile.');
 const ue=uidErr(s);u.className='hint '+(ue?'bad':'');u.textContent=ue||'Used to cross-check the employee profile.';
 clearTimeout(kycT);
 if(ok){k.innerHTML=`<div class="card row" style="margin-top:14px;background:rgba(47,194,123,.08);border-color:rgba(47,194,123,.25)"><span class="muted">${ic('shield',18)}</span><div class="big" style="font-size:15px">Checking TMB profile…</div></div>`;
  kycT=setTimeout(()=>{k.innerHTML=`<div class="card row" style="margin-top:14px;background:rgba(47,194,123,.08);border-color:rgba(47,194,123,.25)"><span class="ico">${ic('check',20)}</span><div><div class="big" style="font-size:15px">Profile matched</div><div class="muted">KYC verified · Current account active</div></div></div>`},850)}
 else k.innerHTML=''}
function live(){const c=cur();if(c.n==='add')updAdd();if(c.n==='edit')updEdit();paintCta()}

function ctaFor(c){const d=c.d;
 if(c.n==='add')return{a:'add-emp',t:'Add employee',ok:!addErr(d.dr)};
 if(c.n==='edit')return{a:'save-emp',t:'Save changes',ok:compNet(d.dr.sal)>=0};
 if(c.n==='sched')return{a:'save-sched',t:'Save schedule',ok:true};
 if(c.n==='manual'){const x=runCalc(d.sel||[]);return{a:'pay',t:x.n?`Pay ${x.n} · ${cash(x.total)}`:'Select employees',ok:x.n>0&&x.total<=D.bal}}
 return null}
let mbH=null;
function mb(c){if(!IN_TG)return;const M=tg.MainButton;if(mbH){M.offClick(mbH);mbH=null}
 if(!c){M.hide();return}
 mbH=()=>act(c.a);M.onClick(mbH);M.setParams({text:c.t,color:'#17803f',text_color:'#ffffff'});c.ok?M.enable():M.disable();M.show()}
function paintCta(){const c=ctaFor(cur()),el=$('#cta');
 if(!c){el.classList.add('hide');el.innerHTML=''}
 else{el.classList.remove('hide');el.innerHTML=`<button class="btn" data-a="${c.a}" ${c.ok?'':'disabled'}>${c.t}</button>`}
 mb(c)}

function openSheet(h){$('#pn').innerHTML=h;$('#sheet').classList.add('on')}
function closeSheet(){$('#sheet').classList.remove('on')}
function openPay(){const d=cur().d;const x=runCalc(d.sel||[]);
 if(!x.n)return toast('Select at least one employee','bad');
 if(x.total>D.bal)return toast('Insufficient balance','bad');
 openSheet(`<div class="grab"></div><h3 class="sh-t">Confirm payroll</h3><p class="muted" style="margin:4px 0 12px">Review the run before we send it.</p>
<div class="kv"><span>Employees</span><b>${x.n}</b></div>
<div class="kv"><span>Net to employees</span><b>${cash(r2(x.sum-x.fees))}</b></div>
<div class="kv"><span>Employer PMS fee</span><b>${cash(x.emp)}</b></div>
<div class="kv"><span>Total debit</span><b>${cash(x.total)}</b></div>
<div class="kv" style="border:0"><span>Balance after</span><b>${cash(r2(D.bal-x.total))}</b></div>
<button class="btn" data-a="confirm" style="margin-top:18px">Confirm &amp; pay</button>
<button class="btn ghost" style="margin-top:10px" data-a="close">Cancel</button>`)}
function doPay(){const d=cur().d;const x=runCalc(d.sel||[]);if(!x.n||x.total>D.bal)return;
 const b=$('#pn .btn');if(b){b.disabled=true;b.textContent='Processing…'}
 setTimeout(()=>{D.bal=r2(D.bal-x.total);D.hist=[...D.hist.slice(1),D.bal];
  D.txns.unshift({t:`Payroll · ${x.n} employee${x.n>1?'s':''}`,a:-x.total,c:'Cash',d:today(),k:'out'});
  save();closeSheet();hap('medium');
  try{tg&&tg.HapticFeedback&&tg.HapticFeedback.notificationOccurred('success')}catch(e){}
  $('#done').innerHTML=`<div class="dn"><svg class="chk" width="104" height="104" viewBox="0 0 96 96"><circle cx="48" cy="48" r="44" fill="rgba(47,194,123,.14)" stroke="#2fc27b" stroke-width="2"/><path d="M30 50l12 12 24-26" fill="none" stroke="#3ff09a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg><h2>Payroll sent</h2><p class="muted">${x.n} employee${x.n>1?'s':''} paid successfully</p><div class="card"><div class="kv"><span>Total debit</span><b>${cash(x.total)}</b></div><div class="kv" style="border:0"><span>Balance now</span><b>${cash(D.bal)}</b></div></div><button class="btn" data-a="done-ok">Done</button></div>`;
  $('#done').classList.add('on')},950)}

function act(a,el){const c=cur(),d=c.d,dr=d.dr;
 switch(a){
  case 'noop':return;
  case 'tab':return tab(el.dataset.v);
  case 'back':return back();
  case 'toast':return toast(el.dataset.m);
  case 'hide':D.hide=!D.hide;save();return render('keep');
  case 'sw':D.prefs[el.dataset.k]=!D.prefs[el.dataset.k];save();return render('keep');
  case 'go-payroll':return go('payroll',{f:'all',q:''});
  case 'go-sched':return go('sched',{dr:clone(D.sched)});
  case 'go-manual':return go('manual',{sel:D.emps.filter(e=>e.st==='active'&&e.sel).map(e=>e.id)});
  case 'add':return go('add',{dr:{email:'',name:'',uid:''}});
  case 'edit':{const e=D.emps.find(x=>x.id===el.dataset.id);return go('edit',{id:e.id,dr:clone(e)})}
  case 'st':dr.st=el.dataset.v;return render('keep');
  case 'freq':dr.f=el.dataset.v;return render('keep');
  case 'timing':dr.t=el.dataset.v;return render('keep');
  case 'save-sched':D.sched=clone(dr);save();toast('Payday schedule saved');return back();
  case 'add-emp':{const err=addErr(dr);if(err)return toast(err,'bad');
   const nm=dr.name.trim()||nameFrom(dr.email.trim());
   D.emps.push({id:'e'+Date.now(),name:nm,email:dr.email.trim(),pos:'',st:'active',gender:'',join:new Date().toISOString().slice(0,10),phone:'',addr:'',dob:'',nid:'',uid:dr.uid||'',sal:{b:0,fi:0,lv:0,ot:0,al:0,ov:null},sel:false});
   save();toast(nm+' added as Active');return back()}
  case 'save-emp':{if(compNet(dr.sal)<0)return toast('Net pay cannot be negative','bad');
   const i=D.emps.findIndex(x=>x.id===d.id);D.emps[i]=Object.assign(clone(D.emps[i]),clone(dr));save();toast(D.emps[i].name+' updated');return back()}
  case 'sel':{const id=el.dataset.id,s=d.sel||[];d.sel=s.includes(id)?s.filter(x=>x!==id):[...s,id];return render('keep')}
  case 'all':d.sel=D.emps.filter(e=>e.st==='active').map(e=>e.id);return render('keep');
  case 'none':d.sel=[];return render('keep');
  case 'filter':d.f=el.dataset.v;return render('keep');
  case 'pay':return openPay();
  case 'confirm':return doPay();
  case 'close':return closeSheet();
  case 'done-ok':$('#done').classList.remove('on');tabN='business';stack=[{n:'business',d:{}},{n:'payroll',d:{f:'all',q:''}}];return render('in-r');
 }}

document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t||t.disabled)return;hap('light');act(t.dataset.a,t)});
function onIn(e){const el=e.target,d=cur().d;
 if(el.dataset.q!==undefined){d.q=el.value;const l=$('#list');if(l)l.innerHTML=listHTML(d);return}
 const k=el.dataset.k;if(!k||!d.dr)return;
 let v=el.value;if(el.type==='number')v=v===''?(k==='sal.ov'?null:0):Number(v);
 const [a,b]=k.split('.');if(b)d.dr[a][b]=v;else d.dr[a]=v;
 live()}
document.addEventListener('input',onIn);
document.addEventListener('change',onIn);

if(tg){
 try{tg.ready();tg.expand();tg.setHeaderColor('#0a1120');tg.setBackgroundColor('#0a1120')}catch(e){}
 const sa=()=>{const a=tg.safeAreaInset||{},c=tg.contentSafeAreaInset||{};document.documentElement.style.setProperty('--st',((a.top||0)+(c.top||0))+'px')};
 sa();try{tg.onEvent('safeAreaChanged',sa);tg.onEvent('contentSafeAreaChanged',sa)}catch(e){}
 if(IN_TG)document.body.classList.add('tg');
 try{tg.BackButton.onClick(back)}catch(e){}
}
const TABS=[['accounts','card','Accounts'],['transactions','receipt','Transactions'],['home','home','Home'],['business','biz','Business'],['profile','user','Profile']];
$('#tb').innerHTML=TABS.map(([v,i,t])=>v==='home'
 ?`<button class="home" data-a="tab" data-v="home"><span class="hc">${ic(i,28)}</span><span>${t}</span></button>`
 :`<button data-a="tab" data-v="${v}"><i>${ic(i,24)}</i><span>${t}</span></button>`).join('');
setTimeout(()=>render('in-r'),450);
</script>
</body>
</html>
